name: chaos-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 手动触发

# 同 branch 新 push 取消旧 run — 减少重复邮件
concurrency:
  group: chaos-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start Mentor server
        run: |
          python3 -m http.server 8765 &
          sleep 2
          curl -s -o /dev/null -w "server up: HTTP %{http_code}\n" http://localhost:8765/index.html
          # 确认 workers/ 静态文件可访问 (Web Worker 需要)
          curl -s -o /dev/null -w "worker: HTTP %{http_code}\n" http://localhost:8765/workers/zip-worker.js

      - name: Run chaos tests
        env:
          CI: 'true'
        run: |
          set -e
          run_one() {
            local f="$1"
            if [ ! -f "tests/$f" ]; then
              echo "SKIP missing: tests/$f"
              return 0
            fi
            echo "=== $f ==="
            node "tests/$f"
          }
          run_one verify-cursor-fix.spec.js
          run_one chaos-suite.spec.js
          run_one chaos-wave2.spec.js
          run_one chaos-wave3.spec.js
          run_one chaos-wave4.spec.js
          # a11y-keyboard.spec.js 已从仓库移除 — 不再引用
          run_one roundtrip-real-mentor.spec.js
          # 扩展基线 (存在则跑, 不存在则 skip)
          run_one chaos-wave9.spec.js
          run_one chaos-wave10.spec.js
          run_one v143-empty-state.spec.js

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /tmp/mentor-*.log
            tmp/*.log
          if-no-files-found: ignore
          retention-days: 7
