# chaos-tests — DISABLED for automatic runs
#
# 产品约定：自动化测试在本地跑即可，不再跟 push/PR 绑 CI（避免刷邮件、拖反馈）。
#
# 本地推荐：
#   python -m http.server 8787 --bind 127.0.0.1
#   npm run test:ux:smoke
#   npm run test:ux:full
#   npm run test:ux:chaos
#   node tests/chaos-wave10.spec.js   # 等旧 wave 按需
#
# 若以后要重新打开 CI：把下面 `on` 改回 push + pull_request 即可。

name: chaos-tests

# 仅保留手动入口；默认不触发，不会发失败邮件
on:
  workflow_dispatch:

jobs:
  chaos-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Skipped — run tests locally
        run: |
          echo "chaos-tests CI is disabled."
          echo "Run locally: npm run test:ux:smoke | test:ux:full | test:ux:chaos"
          exit 0
