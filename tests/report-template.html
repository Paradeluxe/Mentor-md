<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f2f1ed;
  --panel: #ffffff;
  --panel-2: #f7f7f4;
  --panel-3: #ebeae5;
  --border-warm: rgba(38, 37, 30, 0.1);
  --border-warm-medium: rgba(38, 37, 30, 0.2);
  --text: #26251e;
  --text-2: rgba(38, 37, 30, 0.6);
  --text-3: rgba(38, 37, 30, 0.4);
  --accent: #f54e00;
  --accent-soft: rgba(245, 78, 0, 0.08);
  --success: #1f8a65;
  --success-soft: rgba(31, 138, 101, 0.1);
  --danger: #cf2d56;
  --danger-soft: rgba(207, 45, 86, 0.08);
  --warning: #d97706;
  --warning-soft: rgba(217, 119, 6, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-size: 14px;
  letter-spacing: 0.04px;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1200px; margin: 0 auto; padding: 32px 48px; }
header {
  background: var(--panel);
  border-radius: 12px;
  padding: 28px 32px;
  margin-bottom: 24px;
  box-shadow: 0 0 0 1px var(--border-warm);
}
h1 { font-size: 1.5em; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 6px; }
.subtitle { color: var(--text-2); font-size: 13px; }

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-top: 20px;
}
.stat {
  background: var(--panel-2);
  border-radius: 8px;
  padding: 12px 16px;
  border: 1px solid var(--border-warm);
}
.stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
.stat-value { font-size: 1.5em; font-weight: 600; margin-top: 4px; letter-spacing: -0.1px; }
.stat-value.pass { color: var(--success); }
.stat-value.fail { color: var(--danger); }
.stat-value.warn { color: var(--warning); }

.section {
  background: var(--panel);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: 0 0 0 1px var(--border-warm);
}
.section-title {
  font-size: 0.95em;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 12px;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .badge {
  font-size: 0.7em;
  font-weight: 500;
  background: var(--panel-3);
  color: var(--text-2);
  padding: 2px 6px;
  border-radius: 9999px;
}

.test {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 2px;
  font-size: 13px;
  transition: background 0.1s;
}
.test:hover { background: var(--panel-2); }
.test-icon {
  width: 14px;
  height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
  font-size: 10px;
  font-weight: 700;
  color: var(--panel);
}
.test-icon.pass { background: var(--success); }
.test-icon.fail { background: var(--danger); }
.test-num {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-3);
  font-size: 11px;
  min-width: 24px;
  flex-shrink: 0;
  margin-top: 1px;
}
.test-title { flex: 1; color: var(--text); font-weight: 500; }
.test-title.fail { color: var(--danger); }
.test-detail {
  margin-top: 8px;
  padding: 12px 14px;
  background: var(--panel-2);
  border-radius: 6px;
  border-left: 3px solid var(--danger);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
  white-space: pre-wrap;
  word-break: break-all;
}
.test-detail.empty { display: none; }
.test-screenshots {
  margin-top: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.test-screenshots img {
  max-width: 200px;
  border-radius: 4px;
  box-shadow: 0 0 0 1px var(--border-warm);
  cursor: pointer;
  transition: transform 0.1s;
}
.test-screenshots img:hover { transform: scale(1.05); }

.asserts {
  margin-top: 6px;
  padding-left: 36px;
  font-size: 12px;
  color: var(--text-2);
}
.assert { padding: 1px 0; }
.assert .pass { color: var(--success); }
.assert .fail { color: var(--danger); }

.progress-bar {
  height: 6px;
  background: var(--panel-3);
  border-radius: 9999px;
  overflow: hidden;
  margin-top: 20px;
}
.progress-fill {
  height: 100%;
  background: var(--success);
  border-radius: 9999px;
  transition: width 0.3s;
}
.progress-fill.has-fail { background: var(--danger); }

footer {
  text-align: center;
  color: var(--text-3);
  font-size: 12px;
  padding: 32px 0;
  letter-spacing: 0.04px;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">耗时 {{DURATION}}s · 退出码 {{EXIT_CODE}}</div>
    <div class="progress-bar">
          <div class="progress-fill {{STATS_CLASS}}" id="progress-fill"></div>
        </div>
    <div class="summary" id="summary"></div>
  </header>
  <div id="sections"></div>
  <footer>Mentor E2E 测试报告 · 由 tests/run-with-report.js 生成</footer>
</div>
<script>
const STATS = {{STATS}};
const SECTIONS = {{SECTIONS}};
const TESTS = {{TESTS}};
const SCREENSHOT_MAP = {{SCREENSHOT_MAP}};

// 渲染统计
function renderSummary() {
  const passRate = STATS.total > 0 ? Math.round(STATS.passed / STATS.total * 100) : 0;
  const assertRate = STATS.asserts > 0 ? Math.round(STATS.assertPass / STATS.asserts * 100) : 0;
  const items = [
    { label: '测试通过', value: `${STATS.passed} / ${STATS.total}`, cls: STATS.failed > 0 ? 'fail' : 'pass' },
    { label: '通过率', value: `${passRate}%`, cls: STATS.failed > 0 ? 'warn' : 'pass' },
    { label: '断言通过', value: `${STATS.assertPass} / ${STATS.asserts}`, cls: STATS.assertFail > 0 ? 'fail' : 'pass' },
    { label: '断言通过率', value: `${assertRate}%`, cls: STATS.assertFail > 0 ? 'warn' : 'pass' },
    { label: '失败测试', value: STATS.failed, cls: STATS.failed > 0 ? 'fail' : 'pass' },
    { label: '耗时', value: `${(STATS.duration / 1000).toFixed(1)}s`, cls: 'pass' },
  ];
  document.getElementById('summary').innerHTML = items.map(i =>
    `<div class="stat"><div class="stat-label">${i.label}</div><div class="stat-value ${i.cls}">${i.value}</div></div>`
  ).join('');

  // 进度条
  const pct = STATS.total > 0 ? (STATS.passed / STATS.total * 100) : 0;
  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.classList.toggle('has-fail', STATS.failed > 0);
}

// 渲染单个 test
function renderTest(t) {
  const hasError = !!t.error;
  const icon = hasError ? '✗' : '✓';
  const cls = hasError ? 'fail' : 'pass';

  // 渲染 assert 列表
  const assertsHtml = (t.asserts || []).map(a => {
    const aCls = a.type === 'pass' ? 'pass' : 'fail';
    const aIcon = a.type === 'pass' ? '✓' : '✗';
    return `<div class="assert"><span class="${aCls}">${aIcon} ${escapeHtml(a.text)}</span></div>`;
  }).join('');

  // 渲染截图
  const shotsHtml = (t.screenshots || []).map(p => {
    const rel = SCREENSHOT_MAP[p] || p;
    return `<img src="${escapeHtml(rel)}" alt="screenshot" onclick="window.open('${escapeHtml(rel)}','_blank')" />`;
  }).join('');
  const shotsBlock = shotsHtml ? `<div class="test-screenshots">${shotsHtml}</div>` : '';

  // 渲染错误
  const errHtml = hasError
    ? `<div class="test-detail">${escapeHtml(t.error.msg)}\n${escapeHtml(t.error.stack || '')}</div>`
    : '';

  return `
    <div class="test">
      <span class="test-icon ${cls}">${icon}</span>
      <span class="test-num">#${t.num}</span>
      <span class="test-title ${cls}">${escapeHtml(t.title)}</span>
    </div>
    ${assertsHtml ? `<div class="asserts">${assertsHtml}</div>` : ''}
    ${errHtml}
    ${shotsBlock}
  `;
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 渲染 sections
function renderSections() {
  const container = document.getElementById('sections');
  // 没有 section 信息时直接列所有 test
  if (SECTIONS.length === 0) {
    container.innerHTML = `<div class="section">${TESTS.map(renderTest).join('')}</div>`;
    return;
  }
  container.innerHTML = SECTIONS.map(s => {
    const sectionTests = TESTS.filter(t => t.section === s.letter);
    return `
      <div class="section">
        <div class="section-title">SECTION ${s.letter}: ${escapeHtml(s.title)} <span class="badge">${sectionTests.length} tests</span></div>
        ${sectionTests.map(renderTest).join('')}
      </div>
    `;
  }).join('');
}

renderSummary();
renderSections();
</script>
</body>
</html>
